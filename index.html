<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI — Sebastien Figari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #39ff64;
      --green-dim: rgba(57,255,100,0.15);
      --bg: #060d06;
      --card: #0d1a0d;
      --white: #f0f0f0;
      --muted: rgba(240,240,240,0.35);
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(57,255,100,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,100,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 32px 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px; height: 44px;
      background: var(--green-dim);
      border: 1px solid rgba(57,255,100,0.3);
      border-radius: 10px;
      display: grid;
      place-items: center;
    }

    .logo svg { width: 22px; height: 22px; }

    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--white);
    }

    .brand span { color: var(--green); }

    .badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--green);
      background: var(--green-dim);
      border: 1px solid rgba(57,255,100,0.25);
      border-radius: 999px;
      padding: 4px 10px;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 24px 0;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.7s ease both;
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--green);
    }

    .hero p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 320px;
      margin: 0 auto;
    }

    /* ── PAYPAL CARD ── */
    .paypal-card {
      position: relative;
      z-index: 1;
      margin: 40px 24px;
      padding: 36px 28px;
      background: var(--card);
      border: 1px solid rgba(57,255,100,0.2);
      border-radius: 20px;
      max-width: 360px;
      width: calc(100% - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeUp 0.9s ease both;
      box-shadow: 0 0 60px rgba(57,255,100,0.06);
    }

    .paypal-card::before {
      content: '';
      position: absolute;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 200px;
      background: radial-gradient(ellipse, rgba(57,255,100,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--green);
      opacity: 0.7;
    }

    .user-name {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      text-align: center;
    }

    .user-name span { color: var(--green); }

    /* QR wrapper */
    .qr-wrapper {
      background: #fff;
      padding: 14px;
      border-radius: 14px;
      box-shadow:
        0 0 0 1px rgba(57,255,100,0.3),
        0 0 40px rgba(57,255,100,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .qr-wrapper:hover {
      transform: scale(1.04);
      box-shadow:
        0 0 0 2px rgba(57,255,100,0.6),
        0 0 60px rgba(57,255,100,0.25);
    }

    /* ⚠️ REMPLACEZ "qrcode-paypal.jpg" par le nom de votre fichier uploadé sur GitHub */
    .qr-wrapper img {
      width: 200px;
      height: 200px;
      display: block;
      border-radius: 6px;
    }

    .pp-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(57,255,100,0.07);
      border: 1px solid rgba(57,255,100,0.2);
      border-radius: 999px;
      padding: 9px 20px;
    }

    .pp-badge svg { width: 20px; height: 20px; flex-shrink: 0; }

    .pp-badge span {
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 1px;
    }

    .cta-text {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 800;
      text-align: center;
      color: var(--white);
    }

    .cta-text em {
      font-style: normal;
      color: var(--green);
    }

    .sub-text {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      padding: 20px 24px 40px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

        <path d="M19.608 8.5c-.73 3.79-3.245 5.71-7.544 5.71H9.83l-1.075 6.836h2.607a.641.641 0 0 0 .632-.54l.026-.14.503-3.182.032-.175a.641.641 0 0 1 .633-.54h.399c2.58 0 4.602-.952 5.193-3.706.247-1.14.12-2.09-.435-2.76a2.29 2.29 0 0 0-.736-.503z" fill="#012169"/>

    <p class="cta-text">Scannez. Payez. <em>C'est réglé.</em></p>

  <footer>© 2026 Nexus AI · figarisebastien4-beep.github.io</footer>

</body>
</html>
